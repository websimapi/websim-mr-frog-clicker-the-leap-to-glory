<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mr. Frog Clicker: The Leap to Glory!</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2e7d32, #66bb6a, #4caf50);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .game-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            align-items: start;
        }

        .main-game {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: relative;
            min-height: 400px;
        }

        .frog-container {
            position: relative;
            margin: 30px 0;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frog {
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .frog:hover {
            transform: scale(1.05);
        }

        .frog:active {
            transform: scale(0.95);
        }

        /* Touch feedback for mobile */
        .frog:active {
            transform: scale(0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: white;
            backdrop-filter: blur(5px);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            cursor: pointer;
            margin: 0;
            transition: background 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .upgrade-item {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(5px);
        }

        .upgrade-button {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.3s ease;
            touch-action: manipulation;
        }

        .upgrade-button:hover {
            background: #45a049;
        }

        .upgrade-button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .world-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .world-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
        }

        .world-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .world-card:active {
            transform: translateY(-2px);
        }

        .world-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            background-size: cover;
            background-position: center;
        }

        .create-world-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.5);
        }

        .primary-button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .primary-button:hover {
            background: #e55a2b;
            transform: translateY(-1px);
        }

        .primary-button:active {
            transform: translateY(0);
        }

        /* ...existing keyframes... */

        @media (max-width: 768px) {
            .game-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
                margin-bottom: 8px;
            }

            .header p {
                font-size: 0.9rem;
            }
            
            .main-game {
                padding: 20px;
                min-height: 350px;
            }

            .frog-container {
                height: 250px;
                margin: 20px 0;
            }
            
            .frog {
                width: 160px;
                height: 160px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin: 15px 0;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .sidebar {
                max-height: none;
                order: -1;
            }

            .world-gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .world-card {
                padding: 12px;
            }

            .world-thumbnail {
                width: 60px;
                height: 60px;
            }

            .create-world-form {
                padding: 15px;
            }

            .form-group input, .form-group textarea {
                padding: 14px;
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .upgrade-item {
                padding: 15px;
                margin-bottom: 12px;
            }

            .upgrade-button, .primary-button {
                padding: 14px 20px;
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .tab {
                padding: 14px 10px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .main-game {
                padding: 15px;
            }

            .frog {
                width: 140px;
                height: 140px;
            }

            .frog-container {
                height: 200px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .stat-card {
                padding: 10px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .sidebar {
                padding: 15px;
            }

            .world-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .primary-button {
                padding: 12px 18px;
                margin: 3px;
            }
        }

        /* Improved scrollbar for webkit browsers */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Loading state improvements */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        .click-effect {
            position: absolute;
            color: #ffd700;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useSyncExternalStore } = React;

        // Global state and socket setup
        const room = new WebsimSocket();
        
        // Utility functions for error handling
        const ErrorHandler = {
            async retryWithBackoff(fn, maxRetries = 3, baseDelay = 1000) {
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        return await fn();
                    } catch (error) {
                        console.warn(`Attempt ${attempt + 1} failed:`, error);
                        
                        if (attempt === maxRetries - 1) {
                            throw error;
                        }
                        
                        const delay = baseDelay * Math.pow(2, attempt) + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            },

            handleNetworkError(error) {
                if (error.message.includes('timeout') || error.message.includes('network')) {
                    return 'Network connection issue. Please check your internet and try again.';
                }
                if (error.message.includes('WebSocket') || error.message.includes('connection')) {
                    return 'Connection lost. Please refresh the page and try again.';
                }
                return 'An unexpected error occurred. Please try again.';
            }
        };
        
        // Asset management
        const AssetManager = {
            async generateAsset(prompt, transparent = false) {
                const cacheKey = `asset_${prompt}_${transparent}`;
                const cached = localStorage.getItem(cacheKey);
                if (cached) return cached;

                try {
                    const result = await ErrorHandler.retryWithBackoff(async () => {
                        return await websim.imageGen({
                            prompt: prompt,
                            transparent: transparent,
                            aspect_ratio: "1:1"
                        });
                    }, 3, 2000);

                    if (result && result.url) {
                        localStorage.setItem(cacheKey, result.url);
                        return result.url;
                    } else {
                        throw new Error('Invalid response from image generation');
                    }
                } catch (error) {
                    console.error('Failed to generate asset after retries:', error);
                    // Return a fallback emoji or placeholder
                    return this.getFallbackAsset(prompt, transparent);
                }
            },

            getFallbackAsset(prompt, transparent) {
                // Return emoji-based fallbacks for different asset types
                if (prompt.includes('frog')) return '🐸';
                if (prompt.includes('bug') || prompt.includes('fly')) return '🐞';
                if (prompt.includes('background') || prompt.includes('pond')) return '🌿';
                return '🎮';
            },

            async getDefaultAssets() {
                try {
                    const assetPromises = {
                        frog: this.generateAsset("cute green cartoon frog character, friendly face, simple design, white background", true),
                        bug: this.generateAsset("small cartoon fly or bug, golden color, white background", true),
                        background: this.generateAsset("peaceful pond with lily pads, cartoon style"),
                        foreground: this.generateAsset("swamp grass and reeds, white background", true),
                        lighting: this.generateAsset("soft warm sunlight rays through trees, white background", true)
                    };

                    // Wait for all assets with individual error handling
                    const results = await Promise.allSettled(Object.entries(assetPromises).map(async ([key, promise]) => {
                        try {
                            const result = await promise;
                            return [key, result];
                        } catch (error) {
                            console.warn(`Failed to generate ${key} asset:`, error);
                            return [key, this.getFallbackAsset(key, true)];
                        }
                    }));

                    const defaults = {};
                    results.forEach(result => {
                        if (result.status === 'fulfilled') {
                            const [key, value] = result.value;
                            defaults[key] = value;
                        }
                    });

                    return defaults;
                } catch (error) {
                    console.error('Failed to load default assets:', error);
                    // Return emoji fallbacks
                    return {
                        frog: '🐸',
                        bug: '🐞',
                        background: '🌿',
                        foreground: '🌱',
                        lighting: '☀️'
                    };
                }
            },

            async generateWorldAssets(worldData) {
                try {
                    const assetPromises = {
                        frog: this.generateAsset(`Mr. Frog character as ${worldData.frogPrompt}, white background`, true),
                        bug: this.generateAsset((worldData.bugPrompt || "small cartoon fly or bug, golden color") + ", white background", true),
                        background: this.generateAsset(worldData.backgroundPrompt),
                        foreground: worldData.foregroundPrompt ? 
                            this.generateAsset(worldData.foregroundPrompt + ", white background", true) : null,
                        lighting: worldData.lightingPrompt ? 
                            this.generateAsset(worldData.lightingPrompt + ", white background", true) : null,
                        environment: worldData.environmentPrompt ? 
                            this.generateAsset(worldData.environmentPrompt + ", white background", true) : null
                    };

                    // Generate assets with individual error handling
                    const results = await Promise.allSettled(Object.entries(assetPromises).map(async ([key, promise]) => {
                        if (promise === null) return [key, null];
                        try {
                            const result = await promise;
                            return [key, result];
                        } catch (error) {
                            console.warn(`Failed to generate ${key} asset for world:`, error);
                            return [key, this.getFallbackAsset(key, true)];
                        }
                    }));

                    const assets = {};
                    results.forEach(result => {
                        if (result.status === 'fulfilled') {
                            const [key, value] = result.value;
                            assets[key] = value;
                        }
                    });

                    return assets;
                } catch (error) {
                    console.error('Failed to generate world assets:', error);
                    throw new Error('Failed to generate world assets. Please try again.');
                }
            }
        };

        // Game state management
        function useGameState() {
            const [gameState, setGameState] = useState({
                bugs: 0,
                bugsPerClick: 1,
                bugsPerSecond: 0,
                totalClicks: 0,
                upgrades: {
                    clickPower: { level: 0, cost: 10, multiplier: 2 },
                    autoClicker: { level: 0, cost: 100, multiplier: 1.5 },
                    frogSpeed: { level: 0, cost: 500, multiplier: 3 },
                },
                currentWorld: null,
                assets: null
            });

            useEffect(() => {
                const savedState = localStorage.getItem('frogClickerState');
                if (savedState) {
                    setGameState(prev => ({ ...prev, ...JSON.parse(savedState) }));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('frogClickerState', JSON.stringify(gameState));
            }, [gameState]);

            useEffect(() => {
                if (gameState.bugsPerSecond > 0) {
                    const interval = setInterval(() => {
                        setGameState(prev => ({
                            ...prev,
                            bugs: prev.bugs + prev.bugsPerSecond
                        }));
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [gameState.bugsPerSecond]);

            return [gameState, setGameState];
        }

        // Click effect component
        function ClickEffect({ x, y, value, bugAsset, onComplete }) {
            useEffect(() => {
                const timer = setTimeout(onComplete, 1000);
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div 
                    className="click-effect" 
                    style={{ left: x, top: y }}
                >
                    +{value} {bugAsset ? (
                        <img 
                            src={bugAsset} 
                            alt="bug" 
                            style={{ 
                                width: '20px', 
                                height: '20px', 
                                display: 'inline-block',
                                verticalAlign: 'middle',
                                marginLeft: '5px'
                            }} 
                        />
                    ) : '🐞'}
                </div>
            );
        }

        // Main game component
        function FrogClicker() {
            const [gameState, setGameState] = useGameState();
            const [activeTab, setActiveTab] = useState('upgrades');
            const [clickEffects, setClickEffects] = useState([]);
            const [assets, setAssets] = useState(null);
            const [isGeneratingAssets, setIsGeneratingAssets] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                if (!assets && !isGeneratingAssets) {
                    loadDefaultAssets();
                }
            }, [assets, isGeneratingAssets]);

            async function loadDefaultAssets() {
                setIsGeneratingAssets(true);
                setError(null);
                try {
                    const defaultAssets = await AssetManager.getDefaultAssets();
                    setAssets(defaultAssets);
                    setGameState(prev => ({ ...prev, assets: defaultAssets }));
                } catch (error) {
                    console.error('Failed to load assets:', error);
                    setError(ErrorHandler.handleNetworkError(error));
                    // Set basic emoji fallbacks so game can still function
                    const fallbackAssets = {
                        frog: '🐸',
                        bug: '🐞',
                        background: '🌿',
                        foreground: '🌱',
                        lighting: '☀️'
                    };
                    setAssets(fallbackAssets);
                } finally {
                    setIsGeneratingAssets(false);
                }
            }

            function handleFrogClick(event) {
                const rect = event.target.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const earnedBugs = gameState.bugsPerClick;
                
                setGameState(prev => ({
                    ...prev,
                    bugs: prev.bugs + earnedBugs,
                    totalClicks: prev.totalClicks + 1
                }));

                const effectId = Date.now() + Math.random();
                setClickEffects(prev => [...prev, { 
                    id: effectId, 
                    x, 
                    y, 
                    value: earnedBugs,
                    bugAsset: assets?.bug 
                }]);
            }

            function removeClickEffect(id) {
                setClickEffects(prev => prev.filter(effect => effect.id !== id));
            }

            function buyUpgrade(upgradeType) {
                const upgrade = gameState.upgrades[upgradeType];
                const cost = Math.floor(upgrade.cost * Math.pow(upgrade.multiplier, upgrade.level));

                if (gameState.bugs >= cost) {
                    setGameState(prev => {
                        const newState = { ...prev };
                        newState.bugs -= cost;
                        newState.upgrades[upgradeType].level += 1;

                        switch (upgradeType) {
                            case 'clickPower':
                                newState.bugsPerClick = Math.floor(newState.bugsPerClick * 1.5);
                                break;
                            case 'autoClicker':
                                newState.bugsPerSecond += 1;
                                break;
                            case 'frogSpeed':
                                newState.bugsPerClick += 2;
                                break;
                        }

                        return newState;
                    });
                }
            }

            if (isGeneratingAssets || !assets) {
                return (
                    <div className="game-container">
                        <div className="header">
                            <h1> Mr. Frog Clicker</h1>
                            <p>Generating your swamp world... <span className="loading"></span></p>
                            {error && (
                                <div style={{ color: '#ff6b6b', marginTop: '10px' }}>
                                    {error}
                                    <button 
                                        onClick={loadDefaultAssets}
                                        style={{ marginLeft: '10px', padding: '5px 10px' }}
                                    >
                                        Retry
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="game-container">
                    <div className="header">
                        <h1> Mr. Frog Clicker: The Leap to Glory!</h1>
                        <p>Click Mr. Frog to catch delicious bugs!</p>
                    </div>

                    <div className="game-content">
                        <div className="main-game" style={{
                            backgroundImage: assets?.background ? `url(${assets.background})` : 'none',
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            position: 'relative'
                        }}>
                            {assets?.lighting && (
                                <div style={{
                                    position: 'absolute',
                                    top: 0,
                                    left: 0,
                                    right: 0,
                                    bottom: 0,
                                    backgroundImage: `url(${assets.lighting})`,
                                    backgroundSize: 'cover',
                                    backgroundPosition: 'center',
                                    opacity: 0.3,
                                    pointerEvents: 'none'
                                }} />
                            )}
                            
                            <div className="frog-container">
                                <img 
                                    src={assets?.frog || '🐸'} 
                                    alt="Mr. Frog" 
                                    className="frog"
                                    onClick={handleFrogClick}
                                />
                                {clickEffects.map(effect => (
                                    <ClickEffect 
                                        key={effect.id}
                                        x={effect.x}
                                        y={effect.y}
                                        value={effect.value}
                                        bugAsset={effect.bugAsset}
                                        onComplete={() => removeClickEffect(effect.id)}
                                    />
                                ))}
                            </div>

                            {assets?.foreground && (
                                <div style={{
                                    position: 'absolute',
                                    bottom: 0,
                                    left: 0,
                                    right: 0,
                                    height: '30%',
                                    backgroundImage: `url(${assets.foreground})`,
                                    backgroundSize: 'cover',
                                    backgroundPosition: 'bottom',
                                    pointerEvents: 'none'
                                }} />
                            )}

                            {assets?.environment && (
                                <div style={{
                                    position: 'absolute',
                                    top: '10%',
                                    right: '10%',
                                    width: '100px',
                                    height: '100px',
                                    backgroundImage: `url(${assets.environment})`,
                                    backgroundSize: 'contain',
                                    backgroundRepeat: 'no-repeat',
                                    backgroundPosition: 'center',
                                    pointerEvents: 'none'
                                }} />
                            )}
                            <div className="stats">
                                <div className="stat-card">
                                    <div className="stat-value">{Math.floor(gameState.bugs)}</div>
                                    <div>Bugs Caught</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-value">{gameState.bugsPerClick}</div>
                                    <div>Per Click</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-value">{gameState.bugsPerSecond}</div>
                                    <div>Per Second</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-value">{gameState.totalClicks}</div>
                                    <div>Total Clicks</div>
                                </div>
                            </div>
                        </div>

                        <div className="sidebar">
                            <div className="tabs">
                                <button 
                                    className={`tab ${activeTab === 'upgrades' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('upgrades')}
                                >
                                    Upgrades
                                </button>
                                <button 
                                    className={`tab ${activeTab === 'gallery' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('gallery')}
                                >
                                    Gallery
                                </button>
                            </div>

                            {activeTab === 'upgrades' && (
                                <UpgradesPanel 
                                    gameState={gameState} 
                                    onBuyUpgrade={buyUpgrade}
                                />
                            )}

                            {activeTab === 'gallery' && (
                                <WorldGallery 
                                    onLoadWorld={(world) => {
                                        setAssets(world.assets);
                                        setGameState(prev => ({ ...prev, currentWorld: world }));
                                    }}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Upgrades panel component
        function UpgradesPanel({ gameState, onBuyUpgrade }) {
            const upgrades = [
                {
                    key: 'clickPower',
                    name: 'Stronger Tongue',
                    description: 'Increases bugs per click',
                    icon: '👅'
                },
                {
                    key: 'autoClicker',
                    name: 'Fly Magnet',
                    description: 'Automatically catches bugs',
                    icon: '🧲'
                },
                {
                    key: 'frogSpeed',
                    name: 'Lightning Reflexes',
                    description: 'Faster bug catching',
                    icon: '⚡'
                }
            ];

            return (
                <div>
                    <h3 style={{ color: 'white', marginBottom: '15px' }}>Upgrades</h3>
                    {upgrades.map(upgrade => {
                        const upgradeData = gameState.upgrades[upgrade.key];
                        const cost = Math.floor(upgradeData.cost * Math.pow(upgradeData.multiplier, upgradeData.level));
                        const canAfford = gameState.bugs >= cost;

                        return (
                            <div key={upgrade.key} className="upgrade-item">
                                <div style={{ display: 'flex', alignItems: 'center', marginBottom: '8px' }}>
                                    <span style={{ fontSize: '1.5rem', marginRight: '10px' }}>{upgrade.icon}</span>
                                    <div>
                                        <div style={{ fontWeight: 'bold' }}>{upgrade.name}</div>
                                        <div style={{ fontSize: '0.8rem', opacity: 0.8 }}>Level {upgradeData.level}</div>
                                    </div>
                                </div>
                                <div style={{ fontSize: '0.9rem', marginBottom: '8px' }}>
                                    {upgrade.description}
                                </div>
                                <button 
                                    className="upgrade-button"
                                    onClick={() => onBuyUpgrade(upgrade.key)}
                                    disabled={!canAfford}
                                >
                                    Buy for {cost} bugs
                                </button>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // World gallery component
        function WorldGallery({ onLoadWorld }) {
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [newWorld, setNewWorld] = useState({
                name: '',
                description: '',
                frogPrompt: '',
                bugPrompt: '',
                backgroundPrompt: '',
                foregroundPrompt: '',
                lightingPrompt: '',
                environmentPrompt: ''
            });
            const [isCreating, setIsCreating] = useState(false);
            const [error, setError] = useState(null);

            const worlds = useSyncExternalStore(
                room.collection('frog_world').subscribe,
                room.collection('frog_world').getList
            );

            async function createWorld() {
                if (!newWorld.name || !newWorld.frogPrompt) return;

                setIsCreating(true);
                setError(null);
                try {
                    const assets = await AssetManager.generateWorldAssets(newWorld);

                    await ErrorHandler.retryWithBackoff(async () => {
                        return await room.collection('frog_world').create({
                            name: newWorld.name,
                            description: newWorld.description,
                            frogPrompt: newWorld.frogPrompt,
                            bugPrompt: newWorld.bugPrompt,
                            backgroundPrompt: newWorld.backgroundPrompt,
                            foregroundPrompt: newWorld.foregroundPrompt,
                            lightingPrompt: newWorld.lightingPrompt,
                            environmentPrompt: newWorld.environmentPrompt,
                            assets: assets,
                            thumbnail: assets.frog
                        });
                    }, 3, 2000);

                    setNewWorld({ 
                        name: '', 
                        description: '', 
                        frogPrompt: '', 
                        bugPrompt: '',
                        backgroundPrompt: '',
                        foregroundPrompt: '',
                        lightingPrompt: '',
                        environmentPrompt: ''
                    });
                    setShowCreateForm(false);
                } catch (error) {
                    console.error('Failed to create world:', error);
                    setError(ErrorHandler.handleNetworkError(error));
                } finally {
                    setIsCreating(false);
                }
            }

            function retryCreateWorld() {
                setError(null);
                createWorld();
            }

            return (
                <div>
                    <h3 style={{ color: 'white', marginBottom: '15px' }}>World Gallery</h3>
                    
                    {error && (
                        <div style={{ 
                            background: 'rgba(255, 107, 107, 0.2)', 
                            color: '#ff6b6b', 
                            padding: '10px', 
                            borderRadius: '5px', 
                            marginBottom: '15px',
                            fontSize: '0.9rem'
                        }}>
                            {error}
                            <button 
                                onClick={retryCreateWorld}
                                style={{ 
                                    marginLeft: '10px', 
                                    padding: '5px 10px', 
                                    background: '#ff6b35',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '3px',
                                    cursor: 'pointer'
                                }}
                            >
                                Retry
                            </button>
                        </div>
                    )}
                    
                    {!showCreateForm && (
                        <button 
                            className="primary-button"
                            onClick={() => setShowCreateForm(true)}
                            style={{ width: '100%', marginBottom: '20px' }}
                        >
                            + Create New World
                        </button>
                    )}

                    {showCreateForm && (
                        <div className="create-world-form">
                            <h4 style={{ color: 'white', marginBottom: '15px' }}>Create New World</h4>
                            
                            <div className="form-group">
                                <label>World Name</label>
                                <input 
                                    type="text"
                                    value={newWorld.name}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, name: e.target.value }))}
                                    placeholder="e.g., Mystic Swamp"
                                />
                            </div>

                            <div className="form-group">
                                <label>Description</label>
                                <textarea 
                                    value={newWorld.description}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, description: e.target.value }))}
                                    placeholder="Describe your world..."
                                    rows="2"
                                />
                            </div>

                            <div className="form-group">
                                <label>Frog Character</label>
                                <input 
                                    type="text"
                                    value={newWorld.frogPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, frogPrompt: e.target.value }))}
                                    placeholder="e.g., magical purple frog with sparkles"
                                />
                            </div>

                            <div className="form-group">
                                <label>Bug/Food Type (optional)</label>
                                <input 
                                    type="text"
                                    value={newWorld.bugPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, bugPrompt: e.target.value }))}
                                    placeholder="e.g., glowing fireflies, golden beetles"
                                />
                            </div>

                            <div className="form-group">
                                <label>Background Scene</label>
                                <input 
                                    type="text"
                                    value={newWorld.backgroundPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, backgroundPrompt: e.target.value }))}
                                    placeholder="e.g., enchanted forest with glowing mushrooms"
                                />
                            </div>

                            <div className="form-group">
                                <label>Foreground Elements (optional)</label>
                                <input 
                                    type="text"
                                    value={newWorld.foregroundPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, foregroundPrompt: e.target.value }))}
                                    placeholder="e.g., swamp grass, lily pads, crystals"
                                />
                            </div>

                            <div className="form-group">
                                <label>Lighting Effects (optional)</label>
                                <input 
                                    type="text"
                                    value={newWorld.lightingPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, lightingPrompt: e.target.value }))}
                                    placeholder="e.g., moonbeams, magical glow, sunset rays"
                                />
                            </div>

                            <div className="form-group">
                                <label>Environment Details (optional)</label>
                                <input 
                                    type="text"
                                    value={newWorld.environmentPrompt}
                                    onChange={(e) => setNewWorld(prev => ({ ...prev, environmentPrompt: e.target.value }))}
                                    placeholder="e.g., floating islands, ancient ruins, magical portals"
                                />
                            </div>

                            <div style={{ display: 'flex', gap: '10px' }}>
                                <button 
                                    className="primary-button"
                                    onClick={createWorld}
                                    disabled={isCreating || !newWorld.name || !newWorld.frogPrompt}
                                >
                                    {isCreating ? <span className="loading"></span> : 'Create World'}
                                </button>
                                <button 
                                    className="primary-button"
                                    onClick={() => setShowCreateForm(false)}
                                    style={{ background: '#666' }}
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="world-gallery">
                        {worlds.reverse().map(world => (
                            <div 
                                key={world.id} 
                                className="world-card"
                                onClick={() => onLoadWorld(world)}
                            >
                                <div 
                                    className="world-thumbnail"
                                    style={{ backgroundImage: `url(${world.thumbnail})` }}
                                />
                                <div style={{ fontWeight: 'bold', marginBottom: '5px' }}>
                                    {world.name}
                                </div>
                                <div style={{ fontSize: '0.8rem', opacity: 0.8 }}>
                                    by {world.username}
                                </div>
                                {world.description && (
                                    <div style={{ fontSize: '0.7rem', marginTop: '5px', opacity: 0.7 }}>
                                        {world.description}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<FrogClicker />, document.getElementById('root'));
    </script>
